name: Chicago 4D — rebuild register once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/chicago-4d-rebuild-register-once.yml'

permissions:
  contents: write

jobs:
  rebuild-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild newspaper register
        working-directory: chicago/4d
        run: python tools/compile_register.py --build

      - name: Verify rebuilt register is deterministic
        working-directory: chicago/4d
        shell: bash
        run: |
          set -euo pipefail
          register='data/research/newspapers/register_1835.json'
          cp "$register" /tmp/register_1835.json
          python tools/compile_register.py --build
          cmp /tmp/register_1835.json "$register"

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          register='chicago/4d/data/research/newspapers/register_1835.json'
          workflow='.github/workflows/chicago-4d-rebuild-register-once.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$register"
          git rm "$workflow"
          git commit -m 'fix(chicago-4d): rebuild 1835 newspaper register'
          git push origin HEAD:dev
