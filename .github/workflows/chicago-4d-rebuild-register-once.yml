name: Chicago 4D — rebuild register once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/chicago-4d-rebuild-register-once.yml'

permissions:
  contents: write

jobs:
  rebuild-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator dependencies
        run: pip install --quiet jsonschema pyproj

      - name: Rebuild newspaper register
        working-directory: chicago/4d
        run: python tools/compile_register.py --build

      - name: Run the full Chicago 4D gate
        working-directory: chicago/4d
        run: ./tools/check.sh

      - name: Commit regenerated register
        shell: bash
        run: |
          set -euo pipefail
          path='chicago/4d/data/research/newspapers/register_1835.json'
          if git diff --quiet -- "$path"; then
            echo 'Register already current; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'chore(chicago-4d): rebuild 1835 newspaper register'
          git push origin HEAD:dev
