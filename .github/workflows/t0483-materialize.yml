name: T0483 materialize staged completion payload

on:
  push:
    branches:
      - research/T-0483-5e8a41-complete

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and unpack completion payload
        shell: bash
        run: |
          set -euo pipefail
          cat .t0483_payload/part* | tr -d '\r\n' > /tmp/t0483.b64
          base64 --decode /tmp/t0483.b64 > /tmp/t0483.gz
          if tar -tzf /tmp/t0483.gz >/tmp/t0483-list.txt 2>/dev/null; then
            cat /tmp/t0483-list.txt
            tar -xzf /tmp/t0483.gz -C .
          else
            gzip -dc /tmp/t0483.gz > /tmp/t0483.payload
            echo 'Decoded payload is not a tar.gz; refusing to alter branch.' >&2
            file /tmp/t0483.payload >&2 || true
            exit 2
          fi
          rm -rf .t0483_payload
          rm -f .github/workflows/t0483-materialize.yml
      - name: Commit materialized T-0483 work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'T-0483: materialize completion payload'
          git push origin HEAD:${GITHUB_REF_NAME}
