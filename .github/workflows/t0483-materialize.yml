name: T0483 finalize recovered cohort

on:
  push:
    branches:
      - research/T-0483-5e8a41-complete

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/T-0483-5e8a41-complete
          fetch-depth: 1
          sparse-checkout: |
            .t0483_recovered
            .github/workflows/t0483-materialize.yml
          sparse-checkout-cone-mode: false
      - name: Rebase recovered work onto latest dev
        shell: bash
        run: |
          set -euo pipefail
          cp -a .t0483_recovered /tmp/t0483_recovered
          git fetch origin dev
          git reset --hard origin/dev
          rm -rf .t0483_payload .t0483_recovered
          mkdir -p chicago/4d/docs/RESEARCH chicago/4d/data/research/residents chicago/4d/data/sources chicago/reference/resident-research/T-0483 chicago/4d/tickets
          cp /tmp/t0483_recovered/chicago/4d/docs/RESEARCH/resident-research-pass-9.md chicago/4d/docs/RESEARCH/
          cp /tmp/t0483_recovered/chicago/4d/data/research/residents/pass_09_findings.json chicago/4d/data/research/residents/
          cp /tmp/t0483_recovered/chicago/4d/data/sources/*.json chicago/4d/data/sources/
          cp /tmp/t0483_recovered/chicago/reference/resident-research/T-0483/README.md chicago/reference/resident-research/T-0483/
          cp /tmp/t0483_recovered/chicago/reference/resident-research/T-0483/T-0483_resident_research.csv chicago/reference/resident-research/T-0483/
          git show origin/dev:chicago/4d/tickets/T-0483-research-ninth-75-person-real-resident-cohort.md > chicago/4d/tickets/T-0483-research-ninth-75-person-real-resident-cohort.md
          git show origin/dev:chicago/4d/tickets/QUEUE.md > chicago/4d/tickets/QUEUE.md
      - name: Regenerate workbook and close ticket
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet openpyxl
          python3 - <<'PY'
          import csv, json, pathlib, re
          from collections import Counter
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          root=pathlib.Path('.')
          cohort=root/'chicago/reference/resident-research/T-0483'
          csv_path=cohort/'T-0483_resident_research.csv'
          findings_path=root/'chicago/4d/data/research/residents/pass_09_findings.json'
          manifest_path=root/'chicago/4d/data/research/residents/pass_09_75_cohort.json'
          rows=list(csv.DictReader(csv_path.open(newline='', encoding='utf-8')))
          assert len(rows)==75, len(rows)
          ids=[r['person_id'] for r in rows]
          assert len(set(ids))==75
          manifest=json.loads(manifest_path.read_text())
          mids=[p['person_id'] for p in manifest['people']]
          assert len(mids)==75 and len(set(mids))==75
          assert set(ids)==set(mids), (set(ids)-set(mids),set(mids)-set(ids))
          findings=json.loads(findings_path.read_text())
          assert findings['status']=='complete'
          assert len(findings['completed_person_ids'])==75
          assert set(findings['completed_person_ids'])==set(ids)
          assert findings['outcome_counts']=={'corroborated':4,'candidate':10,'no_corroboration':61}
          outcomes=Counter(r['research_outcome'] for r in rows)
          assert sum(v for k,v in outcomes.items() if k.startswith('corroborated'))==4, outcomes
          assert sum(v for k,v in outcomes.items() if k.startswith('candidate'))==10, outcomes
          assert sum(v for k,v in outcomes.items() if k.startswith('no_corroboration'))==61, outcomes
          assert not any('pending' in (r['research_outcome'] or '').lower() for r in rows)

          wb=Workbook()
          ws=wb.active; ws.title='Residents'
          headers=list(rows[0].keys())
          ws.append(headers)
          for r in rows: ws.append([r[h] for h in headers])

          wc=wb.create_sheet('Candidates')
          ch=['person_id','name_transcribed','name_normalized','research_outcome','identity_confidence','candidate_ids','evidence_for','evidence_against','source_ids','source_urls_locators','source_tiers','recommended_data_action','notes']
          wc.append(ch)
          for r in rows:
              if r['research_outcome'].startswith('candidate'):
                  wc.append([r[h] for h in ch])

          source_map={}
          for r in rows:
              sids=[x.strip() for x in (r['source_ids'] or '').split(';') if x.strip()]
              urls=[x.strip() for x in (r['source_urls_locators'] or '').split(';') if x.strip()]
              tiers=[x.strip() for x in (r['source_tiers'] or '').split(';') if x.strip()]
              for i,sid in enumerate(sids):
                  rec=source_map.setdefault(sid, {'source_id':sid,'url_or_locator':'','tier':'','used_by':[],'repository_record':''})
                  if i < len(urls) and not rec['url_or_locator']: rec['url_or_locator']=urls[i]
                  if i < len(tiers) and not rec['tier']: rec['tier']=tiers[i]
                  rec['used_by'].append(r['person_id'])
                  p=root/'chicago/4d/data/sources'/f'{sid}.json'
                  if p.exists(): rec['repository_record']=str(p)
          wsources=wb.create_sheet('Sources')
          sh=['source_id','url_or_locator','tier','used_by_person_ids','repository_record']
          wsources.append(sh)
          for sid in sorted(source_map):
              x=source_map[sid]
              wsources.append([x['source_id'],x['url_or_locator'],x['tier'],'; '.join(sorted(set(x['used_by']))),x['repository_record']])

          wlog=wb.create_sheet('Search_Log')
          lh=['person_id','name_normalized','queries','access_dates','research_outcome','source_ids','source_limitations','notes']
          wlog.append(lh)
          for r in rows: wlog.append([r[h] for h in lh])

          for sheet in wb.worksheets:
              sheet.freeze_panes='A2'
              sheet.auto_filter.ref=sheet.dimensions
              for cell in sheet[1]:
                  cell.font=Font(bold=True)
                  cell.fill=PatternFill('solid', fgColor='D9EAF7')
                  cell.alignment=Alignment(vertical='top', wrap_text=True)
              for row in sheet.iter_rows(min_row=2):
                  for cell in row: cell.alignment=Alignment(vertical='top', wrap_text=True)
              for col in range(1, sheet.max_column+1):
                  vals=[str(sheet.cell(r,col).value or '') for r in range(1,min(sheet.max_row,80)+1)]
                  width=min(55,max(10,max((min(len(v),55) for v in vals),default=10)+2))
                  sheet.column_dimensions[get_column_letter(col)].width=width
          out=cohort/'T-0483_resident_research_working.xlsx'
          wb.save(out)
          check=load_workbook(out, read_only=True)
          assert check.sheetnames[:4]==['Residents','Candidates','Sources','Search_Log']
          assert check['Residents'].max_row==76
          assert check['Candidates'].max_row==11
          check.close()

          note=root/'chicago/4d/docs/RESEARCH/resident-research-pass-9.md'
          txt=note.read_text()
          txt=txt.replace('Because T-0484/pass 10 completed before this predecessor landed, actual completed coverage becomes **750** once this PR merges.', 'Because passes 10–12 completed before this predecessor landed, actual completed programme coverage becomes **836** once this PR merges.')
          note.write_text(txt)

          ticket=root/'chicago/4d/tickets/T-0483-research-ninth-75-person-real-resident-cohort.md'
          t=ticket.read_text()
          t=re.sub(r'^state: .*$', 'state: done', t, count=1, flags=re.M)
          t=re.sub(r'^closed: .*$', 'closed: 2026-09-02', t, count=1, flags=re.M)
          t=re.sub(r'^pr: .*$', 'pr: 666', t, count=1, flags=re.M)
          ticket.write_text(t)

          queue=root/'chicago/4d/tickets/QUEUE.md'
          q=queue.read_text()
          q='\n'.join(line for line in q.splitlines() if not line.startswith('T-0483 '))+'\n'
          queue.write_text(q)

          for p in [findings_path, manifest_path,*sorted((root/'chicago/4d/data/sources').glob('resident_research_*.json'))]:
              json.loads(p.read_text())
          print('validated rows=75 outcomes=',dict(outcomes),'workbook=',out)
          PY
      - name: Commit final T-0483 completion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .t0483_payload .t0483_recovered
          rm -f .github/workflows/t0483-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse chicago/4d/docs/RESEARCH/resident-research-pass-9.md \
            chicago/4d/data/research/residents/pass_09_findings.json \
            chicago/4d/data/sources/resident_research_*.json \
            chicago/reference/resident-research/T-0483 \
            chicago/4d/tickets/T-0483-research-ninth-75-person-real-resident-cohort.md \
            chicago/4d/tickets/QUEUE.md
          git status --short
          git diff --cached --stat
          git commit -m 'T-0483: complete ninth 75-person resident research cohort'
          git push --force-with-lease origin HEAD:research/T-0483-5e8a41-complete
