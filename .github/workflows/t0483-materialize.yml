name: T0483 recover staged completion payload

on:
  push:
    branches:
      - research/T-0483-5e8a41-complete

permissions:
  contents: write

jobs:
  repair-part04:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/T-0483-5e8a41-complete
          fetch-depth: 1
          sparse-checkout: |
            .t0483_payload
            .github/workflows/t0483-materialize.yml
          sparse-checkout-cone-mode: false
      - name: Recover the single missing base64 character in part04
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, zlib, sys
          d=pathlib.Path('.t0483_payload')
          a=''.join((d/f'part{i:02d}').read_text().strip() for i in range(4))
          b=(d/'part04').read_text().strip()
          c=(d/'part05').read_text().strip()
          assert len(a)==24000 and len(b)==5999 and len(c)==6000, (len(a),len(b),len(c))
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          # Estimate where the deletion first corrupts the deflate stream by placing the missing char at the end.
          probe=base64.b64decode(a+b+c+'A', validate=True)
          zz=zlib.decompressobj(16+zlib.MAX_WBITS)
          fail=None
          for i,x in enumerate(probe):
              try: zz.decompress(bytes([x]))
              except zlib.error:
                  fail=i; break
          est=max(0,min(len(b), int((fail or 18000)*4/3)-len(a)))
          print('probe_failure_compressed_offset',fail,'estimated_part04_position',est)
          def valid(candidate):
              raw=base64.b64decode(a+candidate+c, validate=True)
              zz=zlib.decompressobj(16+zlib.MAX_WBITS)
              try: out=zz.decompress(raw)
              except zlib.error: return None
              # Validate every complete tar header checksum in the recovered prefix.
              p=0; members=0
              while p+512<=len(out):
                  h=out[p:p+512]
                  if h==b'\0'*512: break
                  try:
                      stored=int((h[148:156].split(b'\0',1)[0].strip() or b'0'),8)
                      chk=sum(h[:148])+sum(b'        ')+sum(h[156:])
                      if stored!=chk: return None
                      size=int((h[124:136].split(b'\0',1)[0].strip() or b'0'),8)
                  except Exception: return None
                  end=p+512+size
                  if end>len(out): break
                  members+=1
                  p=p+512+((size+511)//512)*512
              return (len(out),members)
          ranges=[]
          lo=max(0,est-800); hi=min(len(b),est+800)
          ranges.append(range(lo,hi+1))
          if lo>0 or hi<len(b): ranges.append(range(0,len(b)+1))
          seen=set()
          for rr in ranges:
              for pos in rr:
                  if pos in seen: continue
                  seen.add(pos)
                  for ch in alphabet:
                      cand=b[:pos]+ch+b[pos:]
                      score=valid(cand)
                      if score and score[0] > 1024 and score[1] >= 1:
                          print('recovered_part04_position',pos,'char',ch,'decompressed_bytes',score[0],'complete_members',score[1])
                          (d/'part04').write_text(cand)
                          sys.exit(0)
          raise SystemExit('no valid single-character repair found')
          PY
      - name: Commit repaired part04
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse .t0483_payload/part04
          git diff --cached --quiet && exit 0
          git commit -m 'T-0483: repair staged payload part04'
          git push origin HEAD:research/T-0483-5e8a41-complete
