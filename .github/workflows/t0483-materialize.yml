name: T0483 recover intact staged payload prefix

on:
  push:
    branches:
      - research/T-0483-5e8a41-complete

permissions:
  contents: write

jobs:
  recover-prefix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/T-0483-5e8a41-complete
          fetch-depth: 1
          sparse-checkout: |
            .t0483_payload
            .github/workflows/t0483-materialize.yml
          sparse-checkout-cone-mode: false
      - name: Extract all complete tar members before missing part06
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, zlib, os
          d=pathlib.Path('.t0483_payload')
          s=''.join((d/f'part{i:02d}').read_text().strip() for i in range(6))
          assert len(s)==36000, len(s)
          raw=base64.b64decode(s, validate=True)
          z=zlib.decompressobj(16+zlib.MAX_WBITS)
          out=z.decompress(raw)
          root=pathlib.Path('.t0483_recovered')
          root.mkdir(exist_ok=True)
          report=[f'compressed_prefix_bytes={len(raw)}', f'decompressed_prefix_bytes={len(out)}']
          p=0; n=0
          while p+512 <= len(out):
              h=out[p:p+512]
              if h == b'\0'*512: break
              try:
                  stored=int((h[148:156].split(b'\0',1)[0].strip() or b'0'),8)
                  chk=sum(h[:148])+sum(b'        ')+sum(h[156:])
                  if stored != chk:
                      report.append(f'stop_invalid_header_at={p}')
                      break
                  name=h[:100].split(b'\0',1)[0].decode('utf-8','replace')
                  size=int((h[124:136].split(b'\0',1)[0].strip() or b'0'),8)
                  typ=h[156:157]
              except Exception as e:
                  report.append(f'stop_header_error_at={p}:{e}')
                  break
              data0=p+512; data1=data0+size
              if data1 > len(out):
                  report.append(f'incomplete_member={name} size={size} available={max(0,len(out)-data0)}')
                  break
              report.append(f'complete_member={name} size={size} type={typ!r}')
              if typ in (b'0', b'\0') and name and not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts:
                  target=root/pathlib.PurePosixPath(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(out[data0:data1])
                  n += 1
              p=data0+((size+511)//512)*512
          report.append(f'extracted_regular_files={n}')
          (root/'PREFIX_RECOVERY_REPORT.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY
      - name: Commit recovered complete members
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse .t0483_recovered
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'T-0483: recover intact completion payload prefix'
          git push origin HEAD:research/T-0483-5e8a41-complete
