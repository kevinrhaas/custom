name: Temporary resident synthesis ticket refresh

on:
  push:
    branches:
      - steward/resident-research-synthesis-tickets

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: steward/resident-research-synthesis-tickets
          fetch-depth: 1
          sparse-checkout: |
            chicago/4d/tickets
            chicago/4d/tools/ticket.mjs
            chicago/4d/tools/publish.sh
            site/chicago/4d/tickets.json
          sparse-checkout-cone-mode: false
      - name: Put resident passes four and five in the owner queue
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chicago/4d/tickets/QUEUE.md')
          s = p.read_text()
          target = 'T-0480 — Research sixth 75-person real-resident cohort'
          lines = [
              'T-0478 — Research fourth 75-person real-resident cohort',
              'T-0479 — Research fifth 75-person real-resident cohort',
          ]
          if target not in s:
              raise SystemExit('T-0480 queue anchor missing')
          for line in lines:
              s = s.replace(line + '\n', '')
          s = s.replace(target, '\n'.join(lines) + '\n' + target, 1)
          p.write_text(s)
          PY
      - name: Regenerate ticket board and published mirror
        run: node chicago/4d/tools/ticket.mjs board
      - name: Commit generated ticket state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chicago/4d/tickets/QUEUE.md chicago/4d/tickets/BOARD.md chicago/4d/tickets/tickets.json site/chicago/4d/tickets.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(chicago): regenerate resident synthesis ticket board [skip ci]'
            git push origin HEAD:steward/resident-research-synthesis-tickets
          fi
