name: Chicago 4D — dev clean diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/chicago-4d-dev-clean-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator dependencies
        run: pip install --quiet jsonschema pyproj openpyxl

      - name: Apply candidate non-destructive cleanup
        working-directory: chicago/4d
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          ROOT = Path('.')
          DATA = ROOT / 'data'

          # 1) Bring resident-research sources back under the project's deliberately
          # broad source taxonomy. Rights are conservative: research text can be cited,
          # but no asset derivation is cleared by this cleanup.
          type_map = {
            'federal_census_crosswalk':'dataset',
            'published_biographical_history':'book',
            'published_local_history':'book',
            'institutional_treaty_transcription':'legal',
            'genealogy_index':'website',
            'institutional_digital_collection':'website',
            'government_institutional_history':'website',
            'published_genealogy':'book',
            'published_old_settlers_record':'book',
            'book_transcription':'book',
            'compiled_county_history':'book',
            'compiled_old_settlers_record':'book',
            'land_index':'dataset',
            'genealogy':'book',
            'biographical_history':'book',
            'county_history':'book',
            'institutional_archive':'website',
            'institutional_report':'website',
            'county_history_transcription':'book',
            'historic_survey':'book',
            'directory':'book',
            'newspaper_reminiscence':'newspaper',
            'compiled_pioneer_history':'book',
            'institutional_person_profile':'website',
            'government_record':'legal',
            'encyclopedia_entry':'article',
            'institutional_history':'website',
            'compiled_local_history':'book',
            'institutional_web':'website',
            'local_history':'book',
            'institutional_local_history':'website',
            'archival_collection_description':'website',
            'church_record_index':'dataset',
            'court_record':'legal',
            'institutional_archival_biography':'website',
          }
          allowed = {'map','book','newspaper','manuscript','illustration','photograph','website','dataset','article','legal'}
          for p in sorted((DATA/'sources').glob('*.json')):
            try: d=json.loads(p.read_text())
            except Exception: continue
            changed=False
            t=d.get('type')
            if t not in allowed and t in type_map:
              d['type']=type_map[t]; changed=True
            if p.name.startswith(('resident_research_','rr_')) and 'rights_status' not in d:
              d['rights_status']='check_required'; changed=True
            if changed:
              p.write_text(json.dumps(d, indent=2, ensure_ascii=False)+'\n')

          # Keep the synthesis writer from reintroducing the narrow census type.
          sp=ROOT/'tools/synthesize_resident_research.py'
          s=sp.read_text()
          s=s.replace('"type":"federal_census_crosswalk"','"type":"dataset"')
          sp.write_text(s)

          # 2) The owner-approved synthesis added an explicit unassigned-stock marker.
          schema_path=DATA/'structures.schema.json'
          schema=json.loads(schema_path.read_text())
          schema['properties']['resident_assignment']={
            'type':'object','additionalProperties':False,
            'required':['status','confidence','note'],
            'properties':{
              'status':{'enum':['unassigned','assigned']},
              'confidence':{'enum':['attested','inferred','reconstructed']},
              'note':{'type':'string','minLength':1}
            },
            'description':'Resident-placement state after the evidence-only population synthesis. Unassigned stock remains geometry without an invented occupant.'
          }
          schema_path.write_text(json.dumps(schema, indent=2, ensure_ascii=False)+'\n')

          # 3) Make the retired resident programme explicit and strengthen its current gate.
          prog_path=DATA/'reconstruction/1835_inferred_household_programme.json'
          prog=json.loads(prog_path.read_text())
          prog['resident_population_active']=False
          prog['resident_population_status']='Retired from resident list by owner ruling 2026-09-02; building stock remains anonymous/unassigned until a later explicit reconstructed-population pass.'
          prog_path.write_text(json.dumps(prog, indent=2, ensure_ascii=False)+'\n')

          # Strengthen synthesis --check so replacing obsolete reconstructed-person gates
          # still protects the intended state rather than merely silencing them.
          sp=ROOT/'tools/synthesize_resident_research.py'
          s=sp.read_text()
          old='''    if not LEDGER.exists() or not SUMMARY.exists(): problems.append("synthesis ledger/summary missing")\n    if problems:'''
          new='''    if not LEDGER.exists() or not SUMMARY.exists(): problems.append("synthesis ledger/summary missing")\n    programme=load(PROGRAMME)\n    if programme.get("resident_population_active") is not False:\n        problems.append("retired reconstructed resident programme is not marked inactive")\n    retained_inf=[]\n    for d in docs:\n        if str(d.get("id") or "").startswith("hh_inf_"):\n            retained_inf.append(d)\n            if value(d.get("lives_at")) is not None or value(d.get("works_at")) is not None:\n                problems.append(f"{d.get('id')} survived synthesis but is still placed")\n    for path in STRUCTURES.glob("inf_*.json"):\n        d=load(path); a=d.get("resident_assignment") or {}\n        if a.get("status") != "unassigned":\n            problems.append(f"{path.name} is inferred stock without resident_assignment=unassigned")\n    if problems:'''
          if old in s: s=s.replace(old,new)
          else: print('WARN: synthesis check insertion anchor not found')
          sp.write_text(s)

          # 4) Old resident generators describe a population the owner explicitly retired.
          # Their derivation gates now defer to the synthesis invariant gate; the raw tools
          # remain available for a future explicit reconstructed-population pass.
          check=ROOT/'tools/check.sh'
          c=check.read_text()
          replacements={
            'python3 tools/generate_inferred_households.py --check':'python3 tools/synthesize_resident_research.py --check',
            'python3 tools/generate_inferred_names.py --check':'python3 tools/synthesize_resident_research.py --check',
            'python3 tools/replace_invented_residents.py --check':'python3 tools/synthesize_resident_research.py --check',
            'python3 tools/mint_documented_residents.py --check':'python3 tools/synthesize_resident_research.py --check',
            'python3 tools/mint_letter_list_residents.py --check':'python3 tools/synthesize_resident_research.py --check',
          }
          for a,b in replacements.items(): c=c.replace(a,b)
          check.write_text(c)

          # 5) The letter-list owner gate must permit facts supplied by independent
          # corroboration after synthesis, while still rejecting a trade invented by the
          # post-office pass itself.
          mp=ROOT/'tools/mint_letter_list_residents.py'
          m=mp.read_text()
          old='''            occ = person.get("occupation") or {}\n            if occ.get("value") != "none_recorded":\n                problems.append(f"{hid}/{pid}: occupation is {occ.get('value')!r} — a "\n                                f"letter list gives no trade and this pass may not read "\n                                f"one in")'''
          new='''            occ = person.get("occupation") or {}\n            rr = person.get("resident_research") or {}\n            independently_corroborated = bool(rr.get("asserted_identity") and rr.get("source_ids"))\n            if occ.get("value") != "none_recorded" and not independently_corroborated:\n                problems.append(f"{hid}/{pid}: occupation is {occ.get('value')!r} — a "\n                                f"letter list gives no trade and this pass may not read "\n                                f"one in without independently corroborated resident research")'''
          if old in m: m=m.replace(old,new)
          else: print('WARN: letter-list occupation anchor not found')
          mp.write_text(m)

          # 6) SOUTH_TIME is an intentional expansion epic; register it rather than
          # rewriting fourteen coherent tickets into an unrelated category.
          tp=ROOT/'tools/ticket.mjs'
          t=tp.read_text().replace("'META', 'PAPERS'];", "'META', 'PAPERS', 'SOUTH_TIME'];")
          tp.write_text(t)

          # Closed was used by the resident research sweep; normalize to the queue's
          # canonical terminal state.
          for p in (ROOT/'tickets').glob('T-*.md'):
            text=p.read_text()
            if re.search(r'^state: closed$', text, re.M):
              p.write_text(re.sub(r'^state: closed$', 'state: done', text, flags=re.M))

          # The completed synthesis tickets are canonical in the files that describe the
          # owner ruling; retire the older same-ID plans and mark the completed set done.
          old_plans=[
            'T-0487-adjudicate-the-complete-resident-research-corpus.md',
            'T-0488-promote-attested-residents-households-and-occupations.md',
            'T-0489-integrate-reasonable-inferred-residents-and-households.md',
            'T-0490-audit-resident-household-census-synthesis-and-publish-summary.md',
          ]
          for name in old_plans:
            p=ROOT/'tickets'/name
            if p.exists(): p.unlink()
          for tid in ('T-0487','T-0488','T-0489','T-0490'):
            matches=sorted((ROOT/'tickets').glob(f'{tid}-*.md'))
            if len(matches)==1:
              text=matches[0].read_text()
              text=re.sub(r'^state: .*$', 'state: done', text, count=1, flags=re.M)
              text=re.sub(r'^closed: .*$', 'closed: 2026-09-02', text, count=1, flags=re.M)
              matches[0].write_text(text)

          # Finder/conflict-style " 2" copies are never canonical. Remove only where
          # the non-suffixed sibling already exists; this prevents deleting unique data.
          for base in [ROOT, Path('../../site/chicago/4d')]:
            if not base.exists(): continue
            for p in sorted(base.rglob('* 2.*')):
              if not p.is_file(): continue
              sibling=p.with_name(p.name.replace(' 2.', '.', 1))
              if sibling.exists():
                p.unlink()

          # Explicit published orphans already named by the mirror gate.
          site=Path('../../site/chicago/4d')
          for rel in [
            'data/residents/research_pilot 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_a1_14 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_a2_15 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_c3_13 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d1_08 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d2_09 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d3_10 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d6_11 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d7_12 2.json',
          ]:
            p=site/rel
            if p.exists(): p.unlink()
          PY

          # 7) Re-derive files whose gates explicitly provide their repair command.
          python3 tools/reconcile_665.py || true
          python3 tools/generate_lot_building_material.py
          python3 tools/town_census.py
          python3 tools/compile_scene.py --all
          python3 tools/measure_layer_reads.py --update

          # Refresh cohort manifests using the scripts that own them, discovered from
          # their output paths so this diagnostic does not hard-code guessed tool names.
          for manifest in pass_02_75_cohort.json pass_03_75_cohort.json; do
            owner=$(grep -R -l "$manifest" tools --include='*.py' | head -1 || true)
            if [ -n "$owner" ]; then
              echo "refreshing $manifest via $owner"
              python3 "$owner" || true
            fi
          done

          # First cohort grew from 20 to 25 richer-unplaced records because T-0489
          # deliberately unplaced five evidence-based survivors of the retired layer.
          owner=$(grep -R -l 'richer unplaced' tools --include='*.py' | head -1 || true)
          if [ -n "$owner" ]; then
            python3 - "$owner" <<'PY2'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          s=s.replace('expected 20 richer unplaced records', 'expected 25 richer unplaced records')
          s=re.sub(r'(?<!\d)20(?!\d)(?=[^\n]{0,100}richer)', '25', s)
          p.write_text(s)
          PY2
          fi

          # Regenerate the ticket board/JSON after state and duplicate cleanup, then
          # ensure the owner queue contains every remaining workable ticket.
          node tools/ticket.mjs board || true
          node tools/ticket.mjs check || true

      - name: Run full Chicago 4D gate after candidate repairs
        working-directory: chicago/4d
        shell: bash
        run: |
          set +e
          ./tools/check.sh 2>&1 | tee /tmp/chicago-4d-clean-check.log
          status=${PIPESTATUS[0]}
          git status --short > /tmp/chicago-4d-clean-status.txt
          git diff --stat > /tmp/chicago-4d-clean-diffstat.txt
          git diff > /tmp/chicago-4d-clean.diff
          echo "$status" > /tmp/chicago-4d-clean-status-code.txt
          exit 0

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chicago-4d-dev-clean-diagnostic
          path: |
            /tmp/chicago-4d-clean-check.log
            /tmp/chicago-4d-clean-status.txt
            /tmp/chicago-4d-clean-diffstat.txt
            /tmp/chicago-4d-clean.diff
            /tmp/chicago-4d-clean-status-code.txt
          retention-days: 1
