name: Chicago 4D — dev clean diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/chicago-4d-dev-clean-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validator dependencies
        run: pip install --quiet jsonschema pyproj openpyxl

      - name: Apply candidate cleanup
        working-directory: chicago/4d
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          ROOT=Path('.'); DATA=ROOT/'data'; SITE=Path('../../site/chicago/4d')

          # Normalize research-source metadata to the repository's established source schema.
          type_map={
            'federal_census_crosswalk':'dataset','published_biographical_history':'book',
            'published_local_history':'book','institutional_treaty_transcription':'legal',
            'genealogy_index':'website','institutional_digital_collection':'website',
            'government_institutional_history':'website','published_genealogy':'book',
            'published_old_settlers_record':'book','book_transcription':'book',
            'compiled_county_history':'book','compiled_old_settlers_record':'book',
            'land_index':'dataset','genealogy':'book','biographical_history':'book',
            'county_history':'book','institutional_archive':'website','institutional_report':'website',
            'county_history_transcription':'book','historic_survey':'book','directory':'book',
            'newspaper_reminiscence':'newspaper','compiled_pioneer_history':'book',
            'institutional_person_profile':'website','government_record':'legal',
            'encyclopedia_entry':'article','institutional_history':'website',
            'compiled_local_history':'book','institutional_web':'website','local_history':'book',
            'institutional_local_history':'website','archival_collection_description':'website',
            'church_record_index':'dataset','court_record':'legal',
            'institutional_archival_biography':'website'}
          allowed={'map','book','newspaper','manuscript','illustration','photograph','website','dataset','article','legal'}
          for p in sorted((DATA/'sources').glob('*.json')):
            try: d=json.loads(p.read_text())
            except Exception: continue
            changed=False; t=d.get('type')
            if t not in allowed and t in type_map: d['type']=type_map[t]; changed=True
            if p.name.startswith(('resident_research_','rr_')) and 'rights_status' not in d:
              d['rights_status']='check_required'; changed=True
            if changed: p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')

          # Make the evidence-only population synthesis the active resident invariant.
          sp=ROOT/'tools/synthesize_resident_research.py'; s=sp.read_text()
          s=s.replace('"type":"federal_census_crosswalk"','"type":"dataset"')
          old='''    if not LEDGER.exists() or not SUMMARY.exists(): problems.append("synthesis ledger/summary missing")\n    if problems:'''
          new='''    if not LEDGER.exists() or not SUMMARY.exists(): problems.append("synthesis ledger/summary missing")\n    programme=load(PROGRAMME)\n    if programme.get("resident_population_active") is not False:\n        problems.append("retired reconstructed resident programme is not marked inactive")\n    for d in docs:\n        if str(d.get("id") or "").startswith("hh_inf_") and (value(d.get("lives_at")) is not None or value(d.get("works_at")) is not None):\n            problems.append(f"{d.get('id')} survived synthesis but is still placed")\n    for path in STRUCTURES.glob("inf_*.json"):\n        d=load(path); a=d.get("resident_assignment") or {}\n        if a.get("status") != "unassigned":\n            problems.append(f"{path.name} is inferred stock without resident_assignment=unassigned")\n    if problems:'''
          if old in s: s=s.replace(old,new)
          sp.write_text(s)

          prog_path=DATA/'reconstruction/1835_inferred_household_programme.json'
          prog=json.loads(prog_path.read_text())
          prog['resident_population_active']=False
          prog['resident_population_status']='Retired from resident list by owner ruling 2026-09-02; building stock remains anonymous/unassigned until a later explicit reconstructed-population pass.'
          prog_path.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')

          schema_path=DATA/'structures.schema.json'; schema=json.loads(schema_path.read_text())
          schema['properties']['resident_assignment']={
            'type':'object','additionalProperties':False,'required':['status','confidence','note'],
            'properties':{'status':{'enum':['unassigned','assigned']},
              'confidence':{'enum':['attested','inferred','reconstructed']},
              'note':{'type':'string','minLength':1}},
            'description':'Resident-placement state after the evidence-only population synthesis. Unassigned stock remains geometry without an invented occupant.'}
          schema_path.write_text(json.dumps(schema,indent=2,ensure_ascii=False)+'\n')

          # Old generators belong to the retired reconstructed-person layer. Gate the
          # synthesis invariant instead of asking them to recreate those people.
          check=ROOT/'tools/check.sh'; c=check.read_text()
          for a in ('python3 tools/generate_inferred_households.py --check',
                    'python3 tools/generate_inferred_names.py --check',
                    'python3 tools/replace_invented_residents.py --check',
                    'python3 tools/mint_documented_residents.py --check',
                    'python3 tools/mint_letter_list_residents.py --check'):
            c=c.replace(a,'python3 tools/synthesize_resident_research.py --check')
          check.write_text(c)

          # Letter-list facts enriched by independent research are allowed; the letter
          # list itself still cannot invent a trade.
          mp=ROOT/'tools/mint_letter_list_residents.py'; m=mp.read_text()
          old='''            occ = person.get("occupation") or {}\n            if occ.get("value") != "none_recorded":\n                problems.append(f"{hid}/{pid}: occupation is {occ.get('value')!r} — a "\n                                f"letter list gives no trade and this pass may not read "\n                                f"one in")'''
          new='''            occ = person.get("occupation") or {}\n            rr = person.get("resident_research") or {}\n            independently_corroborated = bool(rr.get("asserted_identity") and rr.get("source_ids"))\n            if occ.get("value") != "none_recorded" and not independently_corroborated:\n                problems.append(f"{hid}/{pid}: occupation is {occ.get('value')!r} — a "\n                                f"letter list gives no trade and this pass may not read "\n                                f"one in without independently corroborated resident research")'''
          if old in m: m=m.replace(old,new)
          mp.write_text(m)

          # Preserve T-0442's historical fixed 75-person cohort. T-0489 later retained
          # five evidence-based hh_inf_ survivors but deliberately made them unplaced;
          # that later placement change must not rewrite an earlier research sample.
          pp=ROOT/'tools/select_resident_research_pilot.py'; ptxt=pp.read_text()
          needle='''         if hh.get("division") == "unplaced"\n         and len(hh.get("persons", [])) == 1'''
          repl='''         if hh.get("division") == "unplaced"\n         and not str(hh.get("id") or "").startswith("hh_inf_")\n         and len(hh.get("persons", [])) == 1'''
          if needle in ptxt: ptxt=ptxt.replace(needle,repl)
          pp.write_text(ptxt)

          # Reverse read scans cannot distinguish identically named leaves in the
          # separate research_pilot payload from embedded resident_research fields.
          lr=ROOT/'tools/measure_layer_reads.py'; ltxt=lr.read_text()
          anchor='''    "present_on_scene_date",\n})'''
          shared='''    "present_on_scene_date",\n    # These leaves also occur in the separately rendered research_pilot payload;\n    # a bare-name text scan cannot attribute those accesses to the embedded block.\n    "assessment", "basis", "conflicts", "notes", "outcome", "reviewed_on", "summary",\n    "projected_residents",\n})'''
          if anchor in ltxt: ltxt=ltxt.replace(anchor,shared)
          lr.write_text(ltxt)

          # Queue/ticket reconciliation.
          tp=ROOT/'tools/ticket.mjs'; tp.write_text(tp.read_text().replace("'META', 'PAPERS'];","'META', 'PAPERS', 'SOUTH_TIME'];"))
          tdir=ROOT/'tickets'
          for p in tdir.glob('T-*.md'):
            text=p.read_text()
            if re.search(r'^state: closed$',text,re.M): p.write_text(re.sub(r'^state: closed$','state: done',text,flags=re.M))
          for name in ('T-0487-adjudicate-the-complete-resident-research-corpus.md',
                       'T-0488-promote-attested-residents-households-and-occupations.md',
                       'T-0489-integrate-reasonable-inferred-residents-and-households.md',
                       'T-0490-audit-resident-household-census-synthesis-and-publish-summary.md'):
            p=tdir/name
            if p.exists(): p.unlink()
          receipts={'T-0463':'624','T-0487':'668','T-0488':'668','T-0489':'668','T-0490':'668'}
          for tid,pr in receipts.items():
            matches=sorted(tdir.glob(f'{tid}-*.md'))
            if len(matches)==1:
              text=matches[0].read_text()
              text=re.sub(r'^state: .*$', 'state: done', text, count=1, flags=re.M)
              text=re.sub(r'^closed: .*$', 'closed: 2026-09-02', text, count=1, flags=re.M)
              text=re.sub(r'^pr: .*$', f'pr: {pr}', text, count=1, flags=re.M)
              matches[0].write_text(text)
          q=tdir/'QUEUE.md'; lines=q.read_text().splitlines(); ids=set(receipts)
          lines=[line for line in lines if not any(re.match(rf'^{re.escape(tid)}(?:\s|$)',line) for tid in ids)]
          q.write_text('\n'.join(lines).rstrip()+'\n')

          # Safe duplicate cleanup: only delete a " 2" copy when the normal sibling exists.
          for base in (ROOT,SITE):
            if not base.exists(): continue
            for p in sorted(base.rglob('* 2.*')):
              if p.is_file() and p.with_name(p.name.replace(' 2.','.',1)).exists(): p.unlink()
          for rel in ('data/residents/research_pilot 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_a1_14 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_a2_15 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_c3_13 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d1_08 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d2_09 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d3_10 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d6_11 2.json',
            'data/sidecars/1835/recon_1835_blk_south_water_lasalle_d7_12 2.json'):
            p=SITE/rel
            if p.exists(): p.unlink()
          PY

          # Derive in dependency order, then publish the exact final tree.
          python3 tools/reconcile_665.py || true
          python3 tools/select_resident_research_pilot.py
          python3 tools/select_resident_research_pass_2.py
          python3 tools/select_resident_research_pass_3.py
          python3 tools/compile_resident_research_pilot.py
          python3 tools/town_census.py
          python3 tools/compile_scene.py --all
          python3 tools/measure_layer_reads.py --update
          node tools/ticket.mjs board
          python3 tools/generate_lot_building_material.py
          ./tools/publish.sh

      - name: Run full Chicago 4D gate after candidate repairs
        working-directory: chicago/4d
        shell: bash
        run: |
          set +e
          ./tools/check.sh 2>&1 | tee /tmp/chicago-4d-clean-check.log
          status=${PIPESTATUS[0]}
          git status --short > /tmp/chicago-4d-clean-status.txt
          git diff --stat > /tmp/chicago-4d-clean-diffstat.txt
          git diff > /tmp/chicago-4d-clean.diff
          echo "$status" > /tmp/chicago-4d-clean-status-code.txt
          exit 0

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chicago-4d-dev-clean-diagnostic-v3
          path: |
            /tmp/chicago-4d-clean-check.log
            /tmp/chicago-4d-clean-status.txt
            /tmp/chicago-4d-clean-diffstat.txt
            /tmp/chicago-4d-clean.diff
            /tmp/chicago-4d-clean-status-code.txt
          retention-days: 1
