name: resident-evidence-synthesis-once

on:
  push:
    branches:
      - resident/1835-evidence-synthesis-20260902

permissions:
  contents: write

jobs:
  synthesize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resident/1835-evidence-synthesis-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Synthesize residents, research and census evidence
        run: |
          cd chicago/4d
          python3 tools/synthesize_resident_research.py | tee /tmp/resident-synthesis.txt
          python3 tools/synthesize_resident_research.py --check
          set +e
          python3 tools/validate.py --all > data/research/residents/synthesis_validate.log 2>&1
          code=$?
          echo "validate_exit_code=$code" >> data/research/residents/synthesis_validate.log
          cat data/research/residents/synthesis_validate.log
          exit 0
      - name: Commit generated synthesis
        run: |
          rm .github/workflows/resident-evidence-synthesis-once.yml
          git config user.name "chatgpt-resident-synthesis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "T-0487 T-0488 T-0489: synthesize evidence-based residents and census links"
          git push origin HEAD:resident/1835-evidence-synthesis-20260902
