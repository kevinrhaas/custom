name: Zion + Bryce app checks

on:
  pull_request:
    paths:
      - 'zion-bryce/**'
      - 'site/zion-bryce/**'
      - 'site/index.html'
      - 'site/sitemap.xml'
      - '.github/workflows/zion-bryce-check.yml'
  push:
    branches: [main]
    paths:
      - 'zion-bryce/**'
      - 'site/zion-bryce/**'
      - 'site/index.html'
      - 'site/sitemap.xml'
      - '.github/workflows/zion-bryce-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zion-bryce-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild deploy mirror
        run: node zion-bryce/build.mjs
      - name: Run content, privacy, and integrity checks
        run: node zion-bryce/check.mjs
      - name: Verify the committed mirror is current
        run: git diff --exit-code -- site/zion-bryce
