name: Chicago 4D — gate

# The fast half of the two-speed build: schema, provenance, date gates,
# referential integrity, licences, staleness, datum re-derivation, JS parse.
# Seconds, and no Blender — the content build lives in chicago-4d-bake.yml.
#
# THIS IS THE DEV GATE (chicago/4d/docs/PIPELINE.md). Neither trigger carries a
# branch filter, which is deliberate and worth stating so nobody "tidies" it into
# `branches: [main]`: the pipeline needs this to run on PRs INTO dev and on
# pushes TO dev, and an unfiltered trigger covers steward branches too. Merging
# into dev is STAGE, not ship — it publishes only the /chicago/4d/dev/ preview,
# and production moves only when the owner dispatches
# chicago-4d-promote-to-prod.yml.
on:
  push:
    paths:
      - 'chicago/4d/**'
      - '.github/workflows/chicago-4d-check.yml'
  pull_request:
    paths:
      - 'chicago/4d/**'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # T-0409's gate needs the merge base to ask what this PR changed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator dependencies
        run: pip install --quiet jsonschema pyproj openpyxl pypdf

      - name: Run the gate
        working-directory: chicago/4d
        run: ./tools/check.sh

      # T-0409 — deliberately NOT inside check.sh. The nightly bake regenerates
      # data/ and correctly ships no entry, so a gate in check.sh would fail
      # every bake. Here the question only gets asked of a pull request, which is
      # where it means something.
      - name: Does this change carry a changelog entry?
        if: github.event_name == 'pull_request'
        run: >
          node chicago/4d/tools/check-changelog-entry.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
