name: T-0478 closeout

on:
  push:
    branches:
      - steward/t0478-closeout

permissions:
  contents: write

jobs:
  close-ticket:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: steward/t0478-closeout
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Close T-0478 with repository tooling
        working-directory: chicago/4d
        run: node tools/ticket.mjs done T-0478 --pr 643
      - name: Remove one-use workflow and commit generated ticket state
        run: |
          rm .github/workflows/t0478-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chicago/4d/tickets/T-0478-research-fourth-75-person-real-resident-cohort.md \
                  chicago/4d/tickets/QUEUE.md \
                  chicago/4d/tickets/BOARD.md \
                  chicago/4d/tickets/tickets.json \
                  site/chicago/4d/tickets.json \
                  .github/workflows/t0478-closeout.yml
          git commit -m "T-0478 close completed resident research ticket"
          git push origin HEAD:steward/t0478-closeout
