name: Deploy to GitHub Pages

# Static site — no build step. Publishes the curated site/ folder (custom
# landing + the Hosta guide app), NOT the whole repo: the repo also holds
# ~2 GB of CAD source (.blend/.stl/.3mf) that must stay OUT of the Pages
# artifact. Mirrors the Polecat platform deploy pattern (upload-pages-artifact
# path: site) — the fleet's single-deploy-authority convention.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check JS parses
        run: |
          set -e
          # `node --check` parses a bare .js as CommonJS, so any ES module
          # (top-level import/export) fails spuriously. Parse each file as a
          # module instead — the Joliet game bundle under site/joliet/app/ is
          # ESM, and its Babylon chunk is several MB, so this also keeps the
          # check off stdin size limits by pointing at the file directly.
          fail=0
          for f in $(git ls-files 'site/**/*.js'); do
            if ! node --input-type=module --check < "$f" >/dev/null 2>&1; then
              # Fall back to script parsing for genuine classic scripts.
              if ! node --check "$f" >/dev/null 2>&1; then
                echo "SYNTAX FAIL: $f"; fail=1
              fi
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "JS OK"
      # Restamp the 4D Chicago gate with the commit that is ACTUALLY being
      # deployed. tools/publish.sh writes a stamp too, but it runs before the
      # commit it belongs to exists, so `git rev-parse HEAD` there names the
      # PARENT — and the stamp went live reading one commit behind itself. The
      # point of the stamp is to answer "which build am I looking at", so being
      # off by one defeats it entirely and, worse, sends whoever is debugging
      # after the wrong commit. Here the answer is knowable, so it is written
      # here. Central Time, matching every other date in the project.
      - name: Stamp the deployed build
        run: |
          set -e
          f=site/chicago/4d/walk/index.html
          [ -f "$f" ] || { echo "no gate to stamp, skipping"; exit 0; }
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          WHEN=$(TZ=America/Chicago date +"%b %-d, %Y, %-I:%M %p CT")
          python3 - "$f" "build $SHORT · $WHEN" <<'PY'
          import re, sys, pathlib
          p, stamp = pathlib.Path(sys.argv[1]), sys.argv[2]
          s = p.read_text()
          # Matches both forms: the published one publish.sh already filled in,
          # and the source one that still carries `hidden` and the placeholder.
          # The rewrite drops `hidden`, so a tree that reached deploy without
          # being published still shows a true stamp rather than nothing.
          new, n = re.subn(
              r'<p class="gate-build" id="gate-build"[^>]*>.*?</p>',
              lambda m: f'<p class="gate-build" id="gate-build">{stamp}</p>', s, flags=re.S)
          if n == 0:
              # Nothing to rewrite is a real problem — the gate would show the
              # publish-time stamp, or the raw placeholder, and both lie.
              print("WARNING: no gate-build element found; stamp not applied")
          else:
              p.write_text(new)
              print(f"stamped: {stamp}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
