name: Deploy to GitHub Pages

# Static site — no build step. Publishes the curated site/ folder (custom
# landing + the tenant apps), NOT the whole repo: the repo also holds CAD source
# (.blend/.stl/.3mf) that must stay OUT of the Pages artifact. Mirrors the
# Polecat platform deploy pattern (upload-pages-artifact path: site) — the
# fleet's single-deploy-authority convention.
#
# 4D CHICAGO MOVED OUT on 2026-09-23 — to kevinrhaas/chicago, served at
# https://chicago.polecat.live/ (app at /4d/). Everything this workflow used to do
# for it (the generated mirror, the build stamp, the /chicago/4d/dev/ preview, the
# URL smoke, the bounded partial clone its 1.3 GB pack needed) left with it.
# site/chicago/** is now a set of small redirect pages that forward every old
# address — path, ?query and #hash — to the new domain (site/chicago/index.html is
# one of them; site/404.html forwards any deeper /chicago/ path the same way).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sanity-check JS parses
        run: |
          set -e
          # `node --check` parses a bare .js as CommonJS, so any ES module
          # (top-level import/export) fails spuriously. Parse each file as a
          # module instead — the Joliet game bundle under site/joliet/app/ is
          # ESM, and its Babylon chunk is several MB, so this also keeps the
          # check off stdin size limits by pointing at the file directly.
          fail=0
          for f in $(find site -name '*.js' -type f | sort); do
            if ! node --input-type=module --check < "$f" >/dev/null 2>&1; then
              # Fall back to script parsing for genuine classic scripts.
              if ! node --check "$f" >/dev/null 2>&1; then
                echo "SYNTAX FAIL: $f"; fail=1
              fi
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "JS OK"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
