name: Chicago 4D — dev clean finalizer

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/chicago-4d-dev-clean-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validator dependencies
        run: pip install --quiet jsonschema pyproj openpyxl

      - name: Reproduce tested candidate cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/chicago-4d-dev-clean-diagnostic.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Apply candidate cleanup')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].strip().startswith('- name: Run full Chicago 4D gate'))
          block = []
          for line in src[run_line + 1:end]:
              if not line.strip():
                  block.append('')
              elif line.startswith('          '):
                  block.append(line[10:])
              else:
                  raise SystemExit(f'unexpected indentation while extracting cleanup: {line!r}')
          Path('/tmp/chicago-4d-tested-cleanup.sh').write_text('\n'.join(block) + '\n')
          PY
          cd chicago/4d
          bash /tmp/chicago-4d-tested-cleanup.sh

      - name: Resolve final resident read-map assertions
        working-directory: chicago/4d
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('tools/measure_layer_reads.py')
          s = p.read_text()

          # The synthesis retired these fields from the data. A read declaration for
          # a field that no longer exists is itself stale and must be removed.
          stale = (
              'households[].grades.reconstructed',
              'persons[].name_basis.value',
              'persons[].name_basis.confidence',
              'persons[].name_basis.note',
          )
          for key in stale:
              s = re.sub(r'^\s*"' + re.escape(key) + r'":\s*\([^\n]*\),\n', '', s, flags=re.M)

          # `min` and `max` are common renderer vocabulary (Math.min/Math.max and
          # range helpers). Bare-leaf matching cannot attribute those accesses to a
          # resident's nested age range, so scan them parent-qualified like `rgb`.
          if '    "min", "max",' not in s:
              s = s.replace(
                  '    "rgb",        # `diffuseColor.rgb` is a three.js shader field, in four files\n',
                  '    "rgb",        # `diffuseColor.rgb` is a three.js shader field, in four files\n'
                  '    "min", "max", # generic range/math leaves; require their data parent to match\n')

          # This field really IS shown: census.js reads it directly for the gate
          # census. Do not hide it in the ambiguous-unread bank.
          s = s.replace('    "projected_residents",\n', '')
          projected = '    "counts.projected_residents": ("shown", "Number(counts.projected_residents)"),\n'
          anchor = '    "counts.letter_list_only": ("shown", "counts.letter_list_only"),\n'
          if projected not in s:
              if anchor not in s:
                  raise SystemExit('could not find resident manifest count declaration anchor')
              s = s.replace(anchor, anchor + projected)

          p.write_text(s)
          PY

          # The baseline is part of the read-map claim, so rewrite it in the same
          # change that corrects the declarations, then republish the exact final tree.
          python3 tools/measure_layer_reads.py --update
          ./tools/publish.sh

      - name: Require a fully green Chicago 4D gate
        working-directory: chicago/4d
        run: ./tools/check.sh

      - name: Commit clean tree to dev
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/chicago-4d-dev-clean-diagnostic.yml
          rm -f .github/workflows/chicago-4d-dev-clean-finalize.yml
          git config user.name 'Kevin Haas'
          git config user.email 'kevinroberthaas@gmail.com'
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No cleanup changes to commit'; exit 1; }
          git commit -m 'fix: restore clean Chicago 4D dev gate after resident synthesis'
          git push origin HEAD:dev
