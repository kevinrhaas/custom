name: Resident synthesis repair

on: [push]

permissions:
  contents: write

concurrency:
  group: resident-synthesis-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resident/1835-evidence-synthesis-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet openpyxl
      - run: python chicago/4d/tools/repair_resident_synthesis_once.py
      - run: |
          rm -f .github/workflows/resident-synthesis-fix-once.yml chicago/4d/tools/repair_resident_synthesis_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'T-0490: make resident synthesis reproducible and capture census bridge'
          git push origin HEAD:resident/1835-evidence-synthesis-20260902
