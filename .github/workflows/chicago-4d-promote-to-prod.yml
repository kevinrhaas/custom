name: Chicago 4D — promote dev to prod

# Ship the integration branch to production (chicago/4d/docs/PIPELINE.md).
#
# DISPATCH-ONLY, NEVER SCHEDULED. This is the owner's switch and nothing else
# throws it. Overnight runs land on `dev` and stay there until it is thrown,
# which is the whole reason the tier exists: main is what the public walks
# through, and nothing reaches it while nobody is looking.
#
# Order matters. Main is back-merged into dev FIRST, so a hotfix that went
# straight to main during an emergency is folded into the integration branch
# before dev is merged forward — otherwise the promotion would silently revert
# it. Then dev merges into main with --no-ff, so the promotion is one reviewable
# commit and `git revert -m 1` undoes exactly it.
#
# Fleet doctrine, kept: PROMOTION is gated, DEPLOY is not. deploy.yml has no
# `needs: test` and never will — a hard test gate on deploy once froze a fleet
# site for ~21 hours. The hotfix exception stands: a production emergency PRs
# straight into main and the next promotion's back-merge collects it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be promoted, then stop
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: chicago-4d-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet jsonschema pyproj

      - name: What is on dev
        id: survey
        run: |
          set -e
          if ! git fetch origin dev 2>/dev/null; then
            echo "::error::dev branch missing — dispatch chicago-4d-pipeline-setup.yml first."
            exit 1
          fi
          COUNT="$(git rev-list --count main..origin/dev)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT commit(s) on dev ahead of main:"
          git log --oneline main..origin/dev | head -40
          # Anything outside the 4D app's scope is a red flag on a promotion
          # whose whole purpose is the 4D app. Reported, not blocked — the owner
          # dispatched this and may have a reason.
          OUT="$(git diff --name-only main..origin/dev -- . ':(exclude)chicago/4d' ':(exclude)site/chicago/4d' | head -20)"
          if [ -n "$OUT" ]; then
            echo "::warning::dev touches paths outside chicago/4d:"
            printf '%s\n' "$OUT"
          fi

      # T-0159 — the guard is on the DESTRUCTIVE steps, not in a step of its own.
      #
      # This used to be a step that printed "nothing promoted" and called
      # `exit 0`. A non-zero-argument `exit` in a `run:` block ends THAT STEP,
      # not the job, so every step below it ran anyway: on 2026-08-23 a
      # `dry_run: true` dispatch printed "dry_run — nothing promoted." and then
      # promoted 27 commits to main, tagged release-v248 and dispatched the
      # deploy. The log said one thing and the repository said another.
      #
      # A dry run is now expressed the only way that cannot lie: the steps that
      # move production are skipped, visibly, in the run's own step list.
      - name: Say what a dry run would have done
        if: inputs.dry_run
        run: |
          echo "dry_run — the promotion steps below are SKIPPED."
          echo "Check the step list: 'Back-merge…' and 'Publish…' must read as skipped."

      - name: Back-merge main into dev, then merge dev into main
        if: ${{ !inputs.dry_run && steps.survey.outputs.count != '0' }}
        run: |
          set -e
          git config user.name  "polecat-ci"
          git config user.email "ci@polecat.live"

          # 1. main → dev, so a hotfix is never lost by the forward merge.
          git checkout -B dev origin/dev
          if ! git merge --no-edit main -m "Back-merge main into dev before promotion"; then
            echo "::error::main does not merge cleanly into dev. Resolve on a branch and re-dispatch."
            exit 1
          fi
          git push origin dev

          # 2. The changelog contract is checked AFTER the merge, not only
          #    before: `merge=union` runs during the merge, so both parents can
          #    be green and the result broken. That is exactly how main once
          #    shipped an unparseable changelog and killed the release feed.
          (cd chicago/4d && node tools/check-changelog.mjs)

          # 3. dev → main, one reviewable commit.
          git checkout main
          COUNT="$(git rev-list --count main..dev)"
          if [ "$COUNT" = "0" ]; then
            echo "Nothing to promote after the back-merge."
            exit 0
          fi
          git merge --no-ff dev -m "Promote chicago/4d dev→prod: $COUNT commit(s)"
          (cd chicago/4d && node tools/check-changelog.mjs)
          git push origin main
          echo "Promoted $COUNT commit(s) to main."

          # 4. Tag the release. The pilot does this and this workflow did not,
          #    which meant a promoted production had no name and no anchor: the
          #    repo's tag list was empty, so "which build is live" could only be
          #    answered with a commit sha, and there was nothing to `git diff`
          #    the last release against or to roll back to by name.
          #
          #    The number is the CHANGELOG's top version, not a counter of our
          #    own. That is already the number Manager, the launcher and the
          #    walkthrough's What's-new tab all show, so a release called
          #    release-v83 is the one a reader can actually find; a second,
          #    independent sequence would be a number nobody could cross-check.
          VER="$(cd chicago/4d && node -e "
            const m = require('fs').readFileSync('renderers/web/js/changelog.js','utf8').match(/v:\s*(\d+)/);
            process.stdout.write(m ? m[1] : '');
          ")"
          if [ -z "$VER" ]; then
            # Not fatal: the promotion has already landed and is live. Losing the
            # tag is a missing label, not a bad deploy, and failing here would
            # report a successful ship as a failure.
            echo "::warning::could not read a changelog version; promotion is live but untagged"
          elif git rev-parse -q --verify "refs/tags/release-v$VER" >/dev/null \
            || git ls-remote --exit-code --tags origin "refs/tags/release-v$VER" >/dev/null 2>&1; then
            # A promotion that ships no new changelog entry reuses the number.
            echo "::notice::release-v$VER already exists — promotion carried no new changelog entry"
          else
            git tag -a "release-v$VER" -m "chicago/4d release v$VER ($COUNT commit(s) promoted)"
            git push origin "release-v$VER"
            echo "Tagged release-v$VER"
          fi

      - name: Publish (GITHUB_TOKEN pushes don't trigger deploy — dispatch it)
        if: ${{ !inputs.dry_run && steps.survey.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
