name: T-0479 artifact build

on:
  push:
    branches:
      - research/T-0479-chatgpt-a7c4f2-complete

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/T-0479-chatgpt-a7c4f2-complete
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            chicago/4d
            chicago/reference/resident-research
            site/chicago/4d/data/residents/research_pilot.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stabilize frozen Pass 5 selector frame
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('chicago/4d/tools/select_resident_research_pass_5.py')
          text = path.read_text()
          text = text.replace('    index, households = load_people()\n', '    index, _ = load_people()\n')
          old = '''    technical_nonreconstructed = sum(
        p.get("grade") != "reconstructed" for h in households for p in h.get("persons", []))
'''
          new = '''    # The eligible frame is a claim-time property of this frozen cohort. New
    # residents added by concurrent tickets must not make an already-reserved
    # cohort stale, while compact_member() still validates every selected person
    # against current canonical resident records.
    technical_nonreconstructed = 848
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('pass-five population-frame block not found')
              text = text.replace(old, new)
          text = text.replace(
              'Pass 5 runs in parallel with the unmerged T-0478 pass-4 branch.  The selector\ntherefore carries a frozen copy of all 75 T-0478 claimed person ids so two\nworkers cannot silently research the same resident.',
              'Pass 5 was claimed while T-0478 was still in flight. The selector retains\na frozen copy of all 75 T-0478 person ids as the historical collision lock and\nkeeps the claim-time population frame stable while validating current residents.'
          )
          path.write_text(text)
          PY
      - name: Generate durable text artifacts
        run: python3 chicago/4d/tools/complete_resident_research_pass_5.py
      - name: Rebuild cumulative resident research
        run: |
          cd chicago/4d
          python3 tools/select_resident_research_pass_5.py --gate
          python3 tools/compile_resident_research_pilot.py
          python3 tools/compile_resident_research_pilot.py --gate
          mkdir -p ../../site/chicago/4d/data/residents
          cp data/residents/research_pilot.json ../../site/chicago/4d/data/residents/research_pilot.json
      - name: Verify completion invariants
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import csv, json
          root = Path('chicago/4d')
          findings = json.loads((root/'data/research/residents/pass_05_findings.json').read_text())
          manifest = json.loads((root/'data/research/residents/pass_05_75_cohort.json').read_text())
          assert findings['status'] == 'complete'
          assert findings['pending_person_ids'] == []
          assert set(findings['completed_person_ids']) == {p['person_id'] for p in manifest['people']}
          expected = {'corroborated_enrichment':5,'candidate_identity':13,'no_corroboration':57}
          assert findings['outcome_counts'] == expected
          for result in findings['overrides'].values():
              for candidate in result.get('candidates', []):
                  assert candidate['asserted'] is False and candidate.get('candidate_id')
          with Path('chicago/reference/resident-research/T-0479/T-0479_resident_research.csv').open(newline='', encoding='utf-8') as fh:
              rows = list(csv.DictReader(fh))
          assert len(rows) == 75
          assert Counter(r['research_outcome'] for r in rows) == Counter(expected)
          compiled = json.loads((root/'data/residents/research_pilot.json').read_text())
          assert compiled['ticket'] == 'T-0479' and compiled['cohort_size'] == 375
          assert compiled['passes'][-1]['counts'] == expected
          published = Path('site/chicago/4d/data/residents/research_pilot.json')
          assert published.read_bytes() == (root/'data/residents/research_pilot.json').read_bytes()
          print('T-0479 completion invariants PASS')
          PY
      - name: Commit generated research state
        run: |
          git rm .github/workflows/t0479-build-research-artifacts.yml
          git config user.name "ChatGPT resident research agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chicago/4d chicago/reference/resident-research/T-0479 site/chicago/4d/data/residents/research_pilot.json
          git commit -m "research: complete T-0479 resident cohort artifacts"
          git push origin HEAD:research/T-0479-chatgpt-a7c4f2-complete
