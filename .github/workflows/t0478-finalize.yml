name: T-0478 minimal closeout

on:
  push:
    branches:
      - steward/resident-research-pass-4-reconciled

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: steward/resident-research-pass-4-reconciled
          fetch-depth: 0
      - name: Generate and validate T-0478 closeout
        working-directory: chicago/4d
        run: python3 tools/t0478_closeout.py
      - name: Run Chicago 4D gate
        working-directory: chicago/4d
        run: ./tools/check.sh
      - name: Commit closeout outputs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/t0478-finalize.yml chicago/4d/tools/t0478_closeout.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'T-0478 generated closeout outputs'
          git push origin HEAD:steward/resident-research-pass-4-reconciled
