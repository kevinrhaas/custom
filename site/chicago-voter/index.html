<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicago Voter — Ballot Match</title>
<meta name="description" content="A short, adaptive scenario survey that fills in every race on a Chicago November 3, 2026 ballot (Ward 30, Precinct 04, ballot style 124) and tells you why: U.S. Senate to the water district, the first elected school board president, six public questions and 60 judges, each candidate researched and cited.">
<meta property="og:title" content="Chicago Voter — Ballot Match">
<meta property="og:description" content="Ten scenario questions, and every race on your November 3, 2026 Chicago ballot filled in, with the reasons and the sources.">
<meta property="og:type" content="website">

<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('chivoter.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-phase="intro">
<div class="flagbg" aria-hidden="true"><span></span><span></span></div>

<nav class="nav">
  <a class="brand" href="./" id="homeLink">
    <span class="stars" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1.5l2.4 7.2h7.6l-6.1 4.5 2.3 7.3L12 16l-6.2 4.5 2.3-7.3L2 8.7h7.6z"/></svg></span>
    <span>Chicago <b>Voter</b></span>
  </a>
  <div class="nav-actions">
    <a class="navlink" href="../">Workshop</a>
    <button class="ballot-btn" id="ballotBtn" type="button" aria-controls="ballot">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span class="bb-l">Ballot so far</span><span class="bb-n" id="ballotCount">0</span>
    </button>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light or dark">🌙</button>
  </div>
</nav>

<div class="layout">
  <main id="app" class="main"></main>
  <aside id="ballot" class="ballot-pane" tabindex="-1" aria-label="Ballot so far"></aside>
