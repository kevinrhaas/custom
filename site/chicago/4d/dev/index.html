<script>
/* 4D Chicago moved to its own home on 2026-09-23. Forward every old address —
   path, ?query and #hash — to chicago.polecat.live. The walkthrough's /walk/
   folder is gone from the new addresses: /chicago/4d/walk/?year=1835 → /4d/?year=1835.
   Works under both kevinrhaas.github.io/custom/chicago/ and custom.polecat.live/chicago/. */
(function () {
  var p = location.pathname, i = p.indexOf('/chicago/');
  var rest = i < 0 ? '/' : p.slice(i + '/chicago'.length);
  rest = rest.replace(/^\/4d\/dev\/walk(\/|$)/, '/4d/dev/').replace(/^\/4d\/walk(\/|$)/, '/4d/');
  location.replace('https://chicago.polecat.live' + rest + location.search + location.hash);
})();
</script>
